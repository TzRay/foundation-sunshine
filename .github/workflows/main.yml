name: Build and Release

# Published releases are owned by sign-and-repackage.yml. Keeping that event
# out of this workflow prevents a release created below from starting another
# build-and-release cycle.
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

# Opt all Node.js 20 actions onto the Node.js 24 runtime. GitHub will
# eventually flip this default itself; setting it explicitly silences the
# `actions/checkout@v4` deprecation warning emitted on every run and keeps
# us forward-compatible with the September 2026 Node 20 removal.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  setup_release:
    name: Setup Build Metadata
    outputs:
      publish_release: ${{ steps.setup_build.outputs.publish_release }}
      release_body: ${{ steps.setup_build.outputs.release_body }}
      release_commit: ${{ steps.setup_build.outputs.release_commit }}
      release_generate_release_notes: ${{ steps.setup_build.outputs.release_generate_release_notes }}
      release_tag: ${{ steps.setup_build.outputs.release_tag }}
      release_version: ${{ steps.setup_build.outputs.release_version }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: 生成构建元数据
        id: setup_build
        shell: bash
        run: |
          SUFFIX=$([ "${{ github.ref_name }}" = "master" ] && echo "" || echo "-dev")
          BUILD_KIND=$([ "${{ github.event_name }}" = "workflow_dispatch" ] && echo "manual" || echo "ci")
          BUILD_TAG="${BUILD_KIND}-$(date +%Y%m%d-%H%M%S)-${{ github.run_number }}${SUFFIX}"

          echo "正在生成独立于上游仓库合并策略的构建元数据。"
          echo "publish_release=false" >> $GITHUB_OUTPUT
          echo "release_body=流水线构建 (${{ github.ref_name }})" >> $GITHUB_OUTPUT
          echo "release_commit=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "release_generate_release_notes=false" >> $GITHUB_OUTPUT
          echo "release_tag=${BUILD_TAG}" >> $GITHUB_OUTPUT
          echo "release_version=${BUILD_TAG}" >> $GITHUB_OUTPUT

  build_win:
    name: Windows
    needs: setup_release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Setup Dependencies Windows
        uses: msys2/setup-msys2@v2
        with:
          msystem: ucrt64
          update: true
          install: >-
            wget
            curl

      - name: Update Windows dependencies
        env:
          opus_version: '1.6.1-1'
        shell: msys2 {0}
        run: |
          # download pinned opus version
          opus_tarball="mingw-w64-ucrt-x86_64-opus-${opus_version}-any.pkg.tar.zst"
          wget https://repo.msys2.org/mingw/ucrt64/${opus_tarball}

          # install dependencies
          # NOTE: gcc/gcc-libs were previously pinned to 15.1.0-5 to work around
          # a broken upstream gcc 15.x. Since msys2 has moved on to gcc 16.x and
          # other packages (cmake, etc.) now require gcc-libs 16.x ABI, pinning
          # an old gcc-libs causes cmake.exe to silently fail to load (exit 127).
          # Let pacman install the full toolchain at the current upstream version.
          dependencies=(
            "git"
            "mingw-w64-ucrt-x86_64-cmake"
            "mingw-w64-ucrt-x86_64-ninja"
            "mingw-w64-ucrt-x86_64-cppwinrt"
            "mingw-w64-ucrt-x86_64-curl-winssl"
            "mingw-w64-ucrt-x86_64-graphviz"
            "mingw-w64-ucrt-x86_64-MinHook"
            "mingw-w64-ucrt-x86_64-miniupnpc"
            "mingw-w64-ucrt-x86_64-nlohmann-json"
            # "mingw-w64-ucrt-x86_64-nodejs"  # Replaced by actions/setup-node (vite 8 requires MSVC Node.js)
            # "mingw-w64-ucrt-x86_64-nsis"  # Replaced by Inno Setup
            "mingw-w64-ucrt-x86_64-onevpl"
            "mingw-w64-ucrt-x86_64-openssl"
            "mingw-w64-ucrt-x86_64-toolchain"
            "mingw-w64-ucrt-x86_64-autotools"
          )

          pacman -Syu --noconfirm "${dependencies[@]}"

          # install pinned opus after Syu to prevent upgrade
          pacman --noconfirm -U ${opus_tarball}

      - name: Verify Build Tools
        shell: msys2 {0}
        run: |
          echo "Verifying build tools are installed..."
          which cmake || (echo "cmake not found" && exit 1)
          which ninja || (echo "ninja not found" && exit 1)
          which gcc || (echo "gcc not found" && exit 1)
          
          echo "All build tools verified successfully"
          echo "  CMake: $(cmake --version | head -1)"
          echo "  Ninja: $(ninja --version)"
          echo "  GCC: $(gcc --version | head -1)"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build Web UI
        shell: pwsh
        run: |
          npm ci
          npm run test:webui
          New-Item -ItemType Directory -Force -Path build | Out-Null
          $env:SUNSHINE_SOURCE_ASSETS_DIR = "${{ github.workspace }}\src_assets"
          $env:SUNSHINE_ASSETS_DIR = "${{ github.workspace }}\build"
          npm run build

      - name: Build Windows
        shell: msys2 {0}
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BUILD_VERSION: ${{ needs.setup_release.outputs.release_tag }}.杂鱼
          COMMIT: ${{ needs.setup_release.outputs.release_commit }}
          GITHUB_TOKEN: ${{ secrets.DRIVER_DOWNLOAD_TOKEN }}
        run: |
          mkdir -p build

          driver_deps_required=ON
          if [ -z "${GITHUB_TOKEN}" ]; then
            driver_deps_required=OFF
            echo "未配置 DRIVER_DOWNLOAD_TOKEN，缺失的私有驱动依赖将降级为警告。"
          else
            echo "已配置 DRIVER_DOWNLOAD_TOKEN，驱动依赖缺失将按错误处理。"
          fi

          cmake \
            -B build \
            -G Ninja \
            -S . \
            -DBUILD_DOCS=OFF \
            -DBUILD_TRAY_TESTS=ON \
            -DBUILD_WEB_UI=OFF \
            -DSUNSHINE_ASSETS_DIR=assets \
            -DDRIVER_DEPS_REQUIRED=${driver_deps_required} \
            -DSUNSHINE_PUBLISHER_NAME='${{ github.repository_owner }}' \
            -DSUNSHINE_PUBLISHER_WEBSITE='https://github.com/AlkaidLab/foundation-sunshine' \
            -DSUNSHINE_PUBLISHER_ISSUE_URL='https://github.com/AlkaidLab/foundation-sunshine/issues'
          ninja -C build

      - name: Run native tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Cache Inno Setup
        id: inno-cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: inno-setup-6

      - name: Install Inno Setup
        if: steps.inno-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://jrsoftware.org/download.php/is.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $installed = $false

          for ($attempt = 1; $attempt -le 3 -and -not $installed; $attempt++) {
            try {
              Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue
              Write-Host "正在下载 Inno Setup，第 ${attempt}/3 次尝试。"
              Invoke-WebRequest `
                -Uri $url `
                -OutFile $installer `
                -MaximumRetryCount 2 `
                -RetryIntervalSec 3

              $file = Get-Item -LiteralPath $installer
              if ($file.Length -lt 1MB) {
                throw "下载文件过小：$($file.Length) 字节。"
              }

              $stream = [System.IO.File]::OpenRead($installer)
              try {
                if ($stream.ReadByte() -ne 0x4D -or $stream.ReadByte() -ne 0x5A) {
                  throw "下载文件缺少有效的 Windows PE 文件头。"
                }
              } finally {
                $stream.Dispose()
              }

              $process = Start-Process `
                -FilePath $installer `
                -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' `
                -PassThru `
                -Wait
              if ($process.ExitCode -ne 0) {
                throw "Inno Setup 安装程序退出码：$($process.ExitCode)。"
              }
              if (-not (Test-Path -LiteralPath $compiler)) {
                throw "安装完成后未找到 ISCC.exe。"
              }

              $installed = $true
              Write-Host "Inno Setup 安装成功。"
            } catch {
              Write-Warning "Inno Setup 官方安装包处理失败：$($_.Exception.Message)"
              if ($attempt -lt 3) {
                Start-Sleep -Seconds 5
              }
            }
          }

          if (-not $installed) {
            Write-Host "官方下载连续失败，改用 Chocolatey 安装 Inno Setup。"
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey 安装 Inno Setup 失败，退出码：$LASTEXITCODE。"
            }
          }

          if (-not (Test-Path -LiteralPath $compiler)) {
            throw "Inno Setup 安装校验失败：未找到 $compiler。"
          }

      - name: Add Inno Setup to PATH
        shell: pwsh
        run: |
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Package Windows
        shell: msys2 {0}
        run: |
          mkdir -p artifacts
          cd build

          # Package the Inno Setup installer and portable ZIP.
          # Install into the staging directory first.
          cmake --install . --prefix ./inno_staging
          
          # Run the Inno Setup compiler.
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" sunshine_installer.iss
          
          # Generate the portable ZIP.
          cpack -G ZIP --config ./CPackConfig.cmake --verbose

          # move
          mv ./cpack_artifacts/Sunshine.exe ../artifacts/sunshine-windows-installer.exe
          mv ./cpack_artifacts/Sunshine.zip ../artifacts/sunshine-windows-portable.zip

      - name: Rename release assets
        shell: msys2 {0}
        run: |
          # Format tag to vYEAR.DATE where DATE is zero-padded to 4 digits
          TAG="${{ needs.setup_release.outputs.release_tag }}"
          NEWTAG="$TAG"

          if [[ "$TAG" =~ ^v([0-9]{4})\.([0-9]+) ]]; then
            YEAR="${BASH_REMATCH[1]}"
            DATE_PART="${BASH_REMATCH[2]}"
            DATE_PADDED=$(printf "%04d" "$DATE_PART")
            NEWTAG="v${YEAR}.${DATE_PADDED}"
          fi

          # 重命名安装包和便携版
          mv artifacts/sunshine-windows-installer.exe "artifacts/Sunshine.${NEWTAG}.WindowsInstaller.exe"
          mv artifacts/sunshine-windows-portable.zip "artifacts/Sunshine.${NEWTAG}.WindowsPortable.zip"

      - name: Generate Checksums
        shell: pwsh
        run: |
          # 使用最终发布文件名生成校验清单，确保用户可以直接执行校验命令。
          .\scripts\generate-checksums.ps1 -Path .\artifacts -Output "SHA256SUMS.txt"

      - name: Package Windows Debug Info
        working-directory: build
        run: |
          # use .dbg file extension for binaries to avoid confusion with real packages
          Get-ChildItem -File -Recurse | `
            % { Rename-Item -Path $_.PSPath -NewName $_.Name.Replace(".exe",".dbg") }

          # save the binaries with debug info
          7z -r `
            "-xr!CMakeFiles" `
            "-xr!cpack_artifacts" `
            a "../artifacts/sunshine-win32-debuginfo.7z" "*.dbg"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-windows-r${{ github.run_number }}
          path: |
            artifacts/Sunshine.*.WindowsInstaller.exe
            artifacts/Sunshine.*.WindowsPortable.zip
            artifacts/SHA256SUMS.txt
            artifacts/checksums.json
          if-no-files-found: error

      - name: Create/Update GitHub Release
        if: needs.setup_release.outputs.publish_release == 'true'
        uses: LizardByte/create-release-action@v2025.426.1549
        with:
          allowUpdates: true
          body: ${{ needs.setup_release.outputs.release_body }}
          generateReleaseNotes: ${{ needs.setup_release.outputs.release_generate_release_notes }}
          name: ${{ needs.setup_release.outputs.release_tag }}.杂鱼
          prerelease: true
          tag: ${{ needs.setup_release.outputs.release_tag }}.杂鱼
          token: ${{ secrets.GH_BOT_TOKEN }}
